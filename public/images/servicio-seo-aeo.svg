<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <!-- Ilustración del servicio SEO + AEO: una búsqueda, la respuesta con IA que
       cita tu web (en rojo) y los resultados de siempre debajo. Sin texto real
       de ningún cliente: es una metáfora del servicio. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f4f0"/>
      <stop offset="1" stop-color="#ece8e1"/>
    </linearGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1d1d1b" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#fondo)"/>

  <!-- Ventana -->
  <g filter="url(#sombra)">
    <rect x="90" y="60" width="620" height="500" rx="16" fill="#fdfdfb" stroke="#e5e2dc"/>
  </g>
  <circle cx="118" cy="86" r="5" fill="#e5e2dc"/>
  <circle cx="136" cy="86" r="5" fill="#e5e2dc"/>
  <circle cx="154" cy="86" r="5" fill="#e5e2dc"/>
  <line x1="90" y1="110" x2="710" y2="110" stroke="#e5e2dc"/>

  <!-- Barra de búsqueda -->
  <rect x="130" y="134" width="540" height="46" rx="23" fill="#f6f4f0" stroke="#e5e2dc"/>
  <circle cx="158" cy="157" r="8" fill="none" stroke="#6b6b68" stroke-width="2.2"/>
  <line x1="164" y1="163" x2="170" y2="169" stroke="#6b6b68" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="184" y="151" width="230" height="12" rx="6" fill="#d3cec5"/>

  <!-- Respuesta con IA -->
  <rect x="130" y="204" width="540" height="190" rx="12" fill="#fdfdfb" stroke="#d3cec5"/>
  <path d="M158 228 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#c2263a"/>
  <rect x="182" y="236" width="120" height="11" rx="5.5" fill="#1d1d1b"/>
  <rect x="154" y="272" width="490" height="10" rx="5" fill="#e5e2dc"/>
  <rect x="154" y="292" width="460" height="10" rx="5" fill="#e5e2dc"/>
  <rect x="154" y="312" width="380" height="10" rx="5" fill="#e5e2dc"/>
  <!-- La cita: tu web -->
  <rect x="154" y="342" width="168" height="32" rx="16" fill="#c2263a"/>
  <circle cx="174" cy="358" r="7" fill="#fdfdfb"/>
  <rect x="188" y="353" width="116" height="10" rx="5" fill="#fdfdfb"/>
  <rect x="332" y="342" width="120" height="32" rx="16" fill="#f0ede7"/>
  <rect x="462" y="342" width="96" height="32" rx="16" fill="#f0ede7"/>

  <!-- Resultados de siempre -->
  <rect x="130" y="420" width="16" height="16" rx="4" fill="#c2263a"/>
  <rect x="156" y="422" width="200" height="11" rx="5.5" fill="#1d1d1b"/>
  <rect x="130" y="446" width="420" height="9" rx="4.5" fill="#e5e2dc"/>
  <rect x="130" y="478" width="16" height="16" rx="4" fill="#d3cec5"/>
  <rect x="156" y="480" width="170" height="11" rx="5.5" fill="#6b6b68"/>
  <rect x="130" y="504" width="380" height="9" rx="4.5" fill="#e5e2dc"/>
</svg>
